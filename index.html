<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3eadb"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>Surco — Mi colección</title>
<style>
:root{--bg:#f3eadb;--card:#fffaf1;--ink:#171717;--muted:#6e675e;--accent:#ef7f22;--accent2:#6c8797;--line:#ddd1c0;--dark:#171717;--phi:1.618;--f8:8px;--f13:13px;--f21:21px;--f34:34px;--f55:55px}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit} button{border:0;cursor:pointer}
.app{max-width:480px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:88px}
header{padding:22px 20px 10px;display:flex;justify-content:space-between;align-items:center}
h1{font-family:Georgia,serif;font-size:30px;line-height:1.05;margin:0}.sub{color:var(--muted);margin-top:7px;font-size:14px}
.icon{width:42px;height:42px;border-radius:50%;background:#fff8ec;box-shadow:0 3px 12px #00000010}
.hero{margin:10px 18px 18px;background:var(--accent);border-radius:28px;min-height:390px;padding:20px;position:relative;overflow:hidden;box-shadow:0 14px 35px #00000018}
.heroCover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.heroShade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,#00000082 100%)}.hero .record{position:absolute;width:310px;height:310px;border-radius:50%;background:radial-gradient(circle,#c9a56b 0 8%,#111 9% 12%,#151515 13% 38%,#0c0c0c 39% 100%);right:-40px;top:60px;box-shadow:0 20px 30px #0005}
.hero .arm{position:absolute;width:12px;height:220px;background:#c6c6c6;right:62px;top:52px;transform:rotate(25deg);border-radius:8px}
.hero .title{position:absolute;z-index:2;left:22px;bottom:20px;font-family:Georgia,serif;font-size:26px;max-width:220px}.hero small{font-family:inherit;color:#332b22}
.section{padding:0 18px}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px}.sectionHead h2{font-family:Georgia,serif;font-size:21px;margin:0}.link{color:var(--accent);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid>div{min-width:0}.grid .albumName{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grid .artist{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cover{aspect-ratio:1;border-radius:15px;object-fit:cover;background:#ddd;box-shadow:0 6px 18px #00000012}.albumName{font-weight:650;font-size:14px;margin-top:7px}.artist{font-size:12px;color:var(--muted);margin-top:2px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#fffaf1eF;backdrop-filter:blur(16px);border-top:1px solid #00000010;display:flex;justify-content:space-around;padding:10px 10px calc(10px + env(safe-area-inset-bottom));z-index:20}
.nav{background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}.nav.active{color:var(--accent);font-weight:700}.nav span:first-child{font-size:22px}
.fab{position:fixed;right:max(22px,calc((100vw - 480px)/2 + 22px));bottom:88px;width:58px;height:58px;border-radius:50%;background:var(--dark);color:#fff;font-size:28px;box-shadow:0 10px 24px #0004;z-index:19}
.page{padding:8px 18px}.search{display:flex;gap:8px;margin:8px 0}.search input{flex:1;padding:14px 16px;border:0;border-radius:18px;background:#fffaf1;box-shadow:inset 0 0 0 1px #0000000d}.pillrow{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.pill{white-space:nowrap;padding:9px 14px;border-radius:99px;background:#e8ddcd;color:#4f493f;font-size:12px}.pill.active{background:var(--accent);color:#fff}
.detail{padding:18px}.detailTop{display:flex;justify-content:space-between}.bigCover{width:100%;aspect-ratio:1;border-radius:24px;object-fit:cover;box-shadow:0 16px 36px #0003}.detail h1{font-size:34px;margin:18px 0 3px}.meta{color:var(--muted);font-size:14px}.expand{width:100%;margin:20px 0;padding:16px;border-radius:18px;background:#fffaf1;font-weight:700}.details{display:none}.details.open{display:block}.card{background:#fffaf1;border-radius:20px;padding:18px;margin:10px 0;box-shadow:0 6px 18px #0000000d}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border:0}.label{color:var(--muted)}
.form{padding:18px}.form h1{margin-bottom:18px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fffaf1}.coverPreview{width:210px;height:210px;border-radius:18px;object-fit:cover;background:#e7ddcf;display:block;margin:0 auto 10px;box-shadow:0 8px 20px #00000012}.coverTools{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:13px 0}.coverTools button{min-height:52px;height:52px;border:1px solid #0000000b;border-radius:18px;background:#fffaf1;display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:0 5px 14px #0000000a;transition:transform .15s,box-shadow .15s}.coverTools button:active{transform:scale(.98);box-shadow:0 2px 8px #0000000a}.coverIcon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#efe4d4;color:var(--accent)}.coverIcon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.coverTools .dangerLite{color:#6e675e}.coverTools button[title]{position:relative}.coverTools button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.coverTools .dangerLite .coverIcon{color:#6e675e}.coverSearch{margin-top:10px}.coverSearchTitle{font-weight:700;font-size:13px;margin:12px 0 8px}.coverResults{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.coverOption{background:#fffaf1;border:1px solid var(--line);border-radius:14px;padding:7px;text-align:left}.coverOption img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#ddd}.coverOption .ct{font-size:11px;line-height:1.25;margin-top:6px}.status{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}.autoFill{margin-top:13px;width:100%;min-height:55px;border-radius:21px;background:#efe4d4;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:650}.scanPanel{margin-top:12px;background:#171717;border-radius:22px;padding:12px;display:none;box-shadow:0 12px 28px #0003}.scanPanel.open{display:block}.scanVideo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;background:#000}.scanHead{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:2px 2px 10px;font-size:13px}.scanClose{background:#fff2;color:#fff;width:34px;height:34px;border-radius:50%}.scanStatus{color:#fff;opacity:.75;font-size:11px;text-align:center;padding:8px 0 2px}.scanManual{display:flex;gap:8px;margin-top:8px}.scanManual input{flex:1;padding:11px 12px;border:0;border-radius:12px;background:#fff}.scanManual button{width:44px;border-radius:12px;background:var(--accent);color:#fff}.autoFill .coverIcon{background:#fffaf1}.genreHint{font-size:11px;color:var(--muted);margin-top:6px}.actions{display:flex;gap:10px;margin-top:18px}.primary{flex:1;background:var(--dark);color:#fff;padding:15px;border-radius:16px;font-weight:700}.secondary{padding:15px;border-radius:16px;background:#e5dacb}.danger{background:#a43b32;color:#fff}.themeGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.theme{padding:14px;border-radius:18px;background:#fffaf1;text-align:left;border:2px solid transparent}.theme.selected{border-color:var(--accent)}.swatches{display:flex;gap:6px;margin-bottom:10px}.swatches i{width:28px;height:28px;border-radius:50%;display:block}
.empty{text-align:center;color:var(--muted);padding:50px 20px}.hidden{display:none!important}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const seed=[
{id:"1",artist:"Pink Floyd",album:"The Dark Side of the Moon",year:"1973",label:"Harvest",country:"UK",catalog:"SHVL 804",format:"LP · 12″",speed:"33 RPM",edition:"Primera edición",genre:"Rock · Rock progresivo",disc:"VG+",sleeve:"VG+",date:"04/10/2026",paid:"25000",market:"45000",location:"Estante 3 · Repisa 2",notes:"Un disco fundamental de mi colección.",favorite:true,cover:""},
{id:"2",artist:"The Beatles",album:"Abbey Road",year:"1969",label:"Apple",country:"UK",catalog:"PCS 7088",format:"LP · 12″",speed:"33 RPM",edition:"Reedición",genre:"Rock · Pop rock",disc:"VG+",sleeve:"VG",date:"01/10/2026",paid:"18000",market:"35000",location:"Estante 1 · Repisa 1",notes:"",favorite:false,cover:""},
{id:"3",artist:"Fleetwood Mac",album:"Rumours",year:"1977",label:"Warner Bros.",country:"USA",catalog:"BSK 3010",format:"LP · 12″",speed:"33 RPM",edition:"Original",genre:"Rock · Soft rock",disc:"VG",sleeve:"VG",date:"28/09/2026",paid:"12000",market:"22000",location:"Estante 2 · Repisa 4",notes:"",favorite:true,cover:""},
{id:"4",artist:"David Bowie",album:"Low",year:"1977",label:"RCA",country:"UK",catalog:"PL 12030",format:"LP · 12″",speed:"33 RPM",edition:"Original",genre:"Rock · Art rock",disc:"VG+",sleeve:"VG+",date:"20/09/2026",paid:"20000",market:"40000",location:"Estante 2 · Repisa 1",notes:"",favorite:false,cover:""}
];
let records=JSON.parse(localStorage.getItem("surco_records")||"null")||seed;
let theme=localStorage.getItem("surco_theme")||"classic";
let currentId=null;
records=records.map(r=>({...r,genre:r.genre||"",barcode:r.barcode||""}));

const themes={
classic:{bg:"#f3eadb",card:"#fffaf1",ink:"#171717",muted:"#6e675e",accent:"#ef7f22"},
blue:{bg:"#d7e7ee",card:"#fffaf1",ink:"#171717",muted:"#65727a",accent:"#3e7893"},
olive:{bg:"#e7e8d8",card:"#fbf9ed",ink:"#1d211a",muted:"#68705e",accent:"#53643e"},
night:{bg:"#202225",card:"#2d3034",ink:"#f7f1e5",muted:"#b9b1a5",accent:"#d88a42"}
};
function applyTheme(){let t=themes[theme];for(let k in t)document.documentElement.style.setProperty("--"+k,t[k]);}
applyTheme();

function money(v){return v?new Intl.NumberFormat("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0}).format(+v):"—"}
function cover(r){
 if(r.cover)return `<img class="cover" src="${r.cover}" alt="">`;
 const colors=["#121212","#31566a","#c4a27a","#2d3232"]; const c=colors[+r.id%colors.length];
 return `<div class="cover" style="background:${c};display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-size:20px;text-align:center;padding:16px">${r.album}<small style="display:block;font:12px system-ui;margin-top:8px">${r.artist}</small></div>`;
}
function nav(active="home"){return `<div class="bottom">
<button class="nav ${active==="home"?"active":""}" onclick="home()"><span>⌂</span>Inicio</button>
<button class="nav ${active==="collection"?"active":""}" onclick="collection()"><span>▦</span>Colección</button>
<button class="nav ${active==="favorites"?"active":""}" onclick="collection(true)"><span>♡</span>Favoritos</button>
<button class="nav" onclick="settings()"><span>•••</span>Más</button></div>`}
function home(){
 let latest=[...records].slice(-3).reverse(), featured=records[0]||seed[0];
 app.innerHTML=`<header><div><h1>Mi colección</h1><div class="sub">${records.length} vinilos</div></div><button class="icon" onclick="settings()">⚙</button></header>
 <section class="hero" onclick="detail('${featured.id}')">${featured.cover?`<img class="heroCover" src="${esc(featured.cover)}" alt="">`:`<div class="record"></div><div class="arm"></div>`}<div class="heroShade"></div><div class="title">${featured.artist}<br><small>${featured.album} · ${featured.year}</small></div></section>
 <section class="section"><div class="sectionHead"><h2>Últimos agregados</h2><button class="link" onclick="collection()">Ver todos</button></div>
 <div class="grid">${latest.map(r=>`<div onclick="detail('${r.id}')">${cover(r)}<div class="albumName">${r.album}</div><div class="artist">${r.artist}</div></div>`).join("")}</div></section>
 <button class="fab" onclick="openVinylForm()">＋</button>${nav("home")}`;
}
function collection(fav=false){
 app.innerHTML=`<header><div><h1>Mi colección</h1><div class="sub">${fav?"Favoritos":records.length+" vinilos"}</div></div></header>
 <div class="page"><div class="search"><input id="q" placeholder="Buscar artista, álbum, sello..." oninput="renderGrid(${fav})"><button class="icon" onclick="filters()">☷</button></div>
 <div class="pillrow"><button class="pill active" onclick="setFilter('')">Todos</button><button class="pill" onclick="setFilter('Rock')">Rock</button><button class="pill" onclick="setFilter('Pop')">Pop</button><button class="pill" onclick="setFilter('Jazz')">Jazz</button><button class="pill" onclick="setFilter('Clásica')">Clásica</button></div><div id="grid" class="grid"></div></div>
 <button class="fab" onclick="openVinylForm()"><span>＋</span></button>${nav("collection")}`; renderGrid(fav);
}
let activeFilter="";
function setFilter(f){activeFilter=f;renderGrid(false)}
function renderGrid(fav=false){
 let q=(document.getElementById("q")?.value||"").toLowerCase();
 let arr=records.filter(r=>(!fav||r.favorite)&&(!activeFilter||r.notes.toLowerCase().includes(activeFilter.toLowerCase())||r.album.toLowerCase().includes(activeFilter.toLowerCase()))&&[r.artist,r.album,r.label,r.country,r.catalog,r.location,r.genre].join(" ").toLowerCase().includes(q));
 document.getElementById("grid").innerHTML=arr.length?arr.map(r=>`<div onclick="detail('${r.id}')">${cover(r)}<div class="albumName">${r.album} ${r.favorite?"♡":""}</div><div class="artist">${r.artist} · ${r.year}</div></div>`).join(""):`<div class="empty" style="grid-column:1/-1">No encontramos vinilos con esos criterios.</div>`;
}
function detail(id){
 currentId=id;let r=records.find(x=>x.id===id); if(!r)return;
 app.innerHTML=`<div class="detail"><div class="detailTop"><button class="icon" onclick="collection()">←</button><div><button class="icon" onclick="toggleFav('${id}')">${r.favorite?"♥":"♡"}</button><button class="icon" onclick="openVinylForm('${id}')">•••</button></div></div>
 <div style="margin-top:16px">${cover(r).replace('class="cover"','class="bigCover"')}</div>
 <h1>${r.artist}</h1><div style="font-family:Georgia,serif;font-size:23px">${r.album}</div><div class="meta">${r.year} · ${r.country||"—"} · ${r.label||"—"}</div>
 <button class="expand" onclick="this.nextElementSibling.classList.toggle('open')">Ver detalles　⌄</button>
 <div class="details">
 <div class="card"><b>Datos de la edición</b>${row("Año",r.year)}${row("Sello",r.label)}${row("País",r.country)}${row("Nº de catálogo",r.catalog)}${row("Formato",r.format)}${row("Velocidad",r.speed)}${row("Edición",r.edition)}${row("Estilo musical",r.genre)}</div>
 <div class="card"><b>Estado</b>${row("Disco",conditionLabel(r.disc)+` (${r.disc||"—"})`)}${row("Portada",conditionLabel(r.sleeve)+` (${r.sleeve||"—"})`)}</div>
 <div class="card"><b>Mi colección</b>${row("Adquisición",r.date)}${row("Precio pagado",money(r.paid))}${row("Valor de mercado",money(r.market))}${row("Ubicación",r.location)}</div>
 ${r.notes?`<div class="card"><b>Mi nota</b><p>${r.notes}</p></div>`:""}</div>
 <div class="actions"><button class="primary" onclick="openVinylForm('${id}')">Editar vinilo</button></div></div>${nav()}`;
}
function row(a,b){return `<div class="row"><span class="label">${a}</span><span>${b||"—"}</span></div>`}
function toggleFav(id){let r=records.find(x=>x.id===id);r.favorite=!r.favorite;save();detail(id)}
const conditionData={
 new:{code:"N",label:"Nuevo",desc:"Sin uso"},
 NM:{code:"NM",label:"Casi nuevo",desc:"Prácticamente sin señales de uso"},
 EX:{code:"EX",label:"Excelente",desc:"Señales mínimas de uso"},
 "VG+":{code:"VG+",label:"Muy bueno +",desc:"Muy buen estado, desgaste leve"},
 VG:{code:"VG",label:"Muy bueno",desc:"Buen estado, desgaste visible"},
 G:{code:"G",label:"Bueno",desc:"Desgaste importante"},
 P:{code:"P",label:"Malo",desc:"Daños importantes"}
};
function conditionLabel(code){return conditionData[code]?.label||code||"—"}
function conditionOptions(selected){return Object.values(conditionData).map(c=>`<option value="${c.code}" ${selected===c.code?"selected":""}>${c.label} (${c.code})</option>`).join("")}
let coverSearchResults=[];
const genreGroups={
"Rock":["Rock","Rock alternativo","Rock progresivo","Hard rock","Soft rock","Art rock","Blues rock","Folk rock","Garage rock","Glam rock","Indie rock","Psychedelic rock","Southern rock","Grunge","Post-rock","Math rock"],
"Pop":["Pop","Pop rock","Synth-pop","Electropop","Indie pop","Dream pop","Power pop","Teen pop","Art pop","Baroque pop"],
"Jazz y blues":["Jazz","Bebop","Cool jazz","Free jazz","Jazz fusion","Smooth jazz","Vocal jazz","Blues","Chicago blues","Delta blues","Soul jazz"],
"Soul, funk y R&B":["Soul","Funk","Motown","Neo soul","R&B","Contemporary R&B","Disco","Gospel"],
"Hip hop":["Hip hop","Rap","Boom bap","Trap","Conscious hip hop","Old school hip hop"],
"Electrónica":["Electrónica","House","Techno","Trance","Ambient","Downtempo","Drum and bass","Dubstep","IDM","Trip hop","Electro","Synthwave"],
"Reggae y ska":["Reggae","Roots reggae","Dub","Dancehall","Ska","Rocksteady"],
"Metal y punk":["Heavy metal","Thrash metal","Death metal","Black metal","Doom metal","Progressive metal","Punk","Hardcore punk","Post-punk","Pop punk"],
"Folk y raíces":["Folk","Folk latinoamericano","Nueva canción","Cantautor","Country","Americana","Bluegrass","Flamenco","Cumbia","Salsa","Tango","Bossa nova","MPB"],
"Clásica":["Música clásica","Barroco","Clasicismo","Romanticismo","Impresionismo","Ópera","Contemporánea","Cámara","Sinfónica"],
"Otros":["Experimental","Industrial","Spoken word","Soundtrack","Navideña","Infantil","World music","Easy listening","New age"]
};
function genreOptions(selected){let out='<option value="">Seleccionar estilo…</option>';for(const [g,items] of Object.entries(genreGroups)){out+=`<optgroup label="${g}">${items.map(x=>`<option value="${esc(x)}" ${selected===x?"selected":""}>${esc(x)}</option>`).join("")}</optgroup>`}return out}
function ico(name){const p={search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/>',camera:'<path d="M4 8.5h3l1.5-2h5L15 8.5h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z"/><circle cx="11" cy="14" r="3.2"/>',image:'<rect x="3" y="4" width="16" height="16" rx="2"/><circle cx="8" cy="9" r="1.3"/><path d="m4.5 17 4.2-4.5 3 3 2.2-2.2 3.6 3.7"/>',x:'<path d="m6 6 10 10M16 6 6 16"/>',scan:'<path d="M7 3H4a1 1 0 0 0-1 1v3M15 3h3a1 1 0 0 1 1 1v3M19 15v3a1 1 0 0 1-1 1h-3M7 19H4a1 1 0 0 1-1-1v-3"/><path d="M7 9h8v4H7z"/>'};return `<span class="coverIcon"><svg viewBox="0 0 22 22" aria-hidden="true">${p[name]}</svg></span>`}


function openVinylForm(id=null){
 let r=id?records.find(x=>x.id===id):{artist:"",album:"",year:"",label:"",country:"",catalog:"",format:"LP · 12″",speed:"33 RPM",edition:"",genre:"",disc:"VG+",sleeve:"VG+",date:new Date().toLocaleDateString("es-CL"),paid:"",market:"",location:"",notes:"",favorite:false,cover:"",barcode:""};
 currentId=id;
 app.innerHTML=`<div class="form"><button class="icon" onclick="${id?`detail('${id}')`:`home()`}">←</button><h1>${id?"Editar vinilo":"Nuevo vinilo"}</h1>
 <div class="field"><label>PORTADA DEL DISCO</label>
 <img id="preview" class="coverPreview" src="${r.cover||""}" style="${r.cover?"":"display:none"}">
 <div class="coverTools" aria-label="Herramientas de portada">
   <button type="button" title="Buscar portada" aria-label="Buscar portada" onclick="searchCover()">${ico('search')}</button>
   <button type="button" title="Tomar foto" aria-label="Tomar foto" onclick="document.getElementById('photoCamera').click()">${ico('camera')}</button>
   <button type="button" title="Elegir foto" aria-label="Elegir foto" onclick="document.getElementById('photoFile').click()">${ico('image')}</button>
   <button type="button" title="Escanear código" aria-label="Escanear código de barras o QR" onclick="openScanner()">${ico('scan')}</button>
   <button class="dangerLite" type="button" title="Quitar portada" aria-label="Quitar portada" onclick="clearCover()">${ico('x')}</button>
 </div>
 <input id="photoCamera" type="file" accept="image/*" capture="environment" hidden onchange="photoPreview(event)">
 <input id="photoFile" type="file" accept="image/*" hidden onchange="photoPreview(event)">
 <div id="coverStatus" class="status">Puedes buscarla por artista y álbum, o usar una foto del disco.</div>
 <div id="coverResults" class="coverSearch"></div>
 <div id="scanPanel" class="scanPanel">
   <div class="scanHead"><span>Escanear código</span><button type="button" class="scanClose" onclick="closeScanner()">×</button></div>
   <video id="scanVideo" class="scanVideo" playsinline muted></video>
   <div id="scanStatus" class="scanStatus">Apunta al código de barras o QR del disco.</div>
   <div class="scanManual"><input id="manualCode" inputmode="numeric" placeholder="Código EAN / UPC"><button type="button" title="Buscar código" aria-label="Buscar código" onclick="lookupBarcode(document.getElementById('manualCode').value)">${ico('search')}</button></div>
 </div>
 </div>
 <div class="field"><label>ARTISTA *</label><input id="artist" value="${esc(r.artist)}"></div><div class="field"><label>ÁLBUM *</label><input id="album" value="${esc(r.album)}"></div>
 <button class="autoFill" type="button" onclick="autofillFromWeb()">${ico('search')}<span>Autorrellenar datos desde la web</span></button>
 <div id="autoResults" class="coverSearch"></div>
 <div class="field"><label>AÑO</label><input id="year" value="${esc(r.year)}" inputmode="numeric"></div><div class="field"><label>SELLO</label><input id="label" value="${esc(r.label)}"></div>
 <div class="field"><label>PAÍS</label><input id="country" value="${esc(r.country)}"></div><div class="field"><label>Nº DE CATÁLOGO</label><input id="catalog" value="${esc(r.catalog)}"></div>
 <div class="field"><label>CÓDIGO DE BARRAS</label><input id="barcode" value="${esc(r.barcode||"")}" inputmode="numeric" placeholder="EAN / UPC"></div>
 <div class="field"><label>FORMATO</label><select id="format"><option>LP · 12″</option><option>EP</option><option>Single · 7″</option><option>Otro</option></select></div>
 <div class="field"><label>VELOCIDAD</label><select id="speed"><option>33 RPM</option><option>45 RPM</option><option>78 RPM</option></select></div>
 <div class="field"><label>EDICIÓN</label><input id="edition" value="${esc(r.edition)}" placeholder="Original, reedición..."></div>
 <div class="field"><label>ESTILO MUSICAL</label><select id="genre">${genreOptions(r.genre||"")}</select><div class="genreHint">Puedes elegir un estilo principal. Más adelante podremos asociar subgéneros.</div></div>
 <div class="field"><label>ESTADO DEL DISCO</label><select id="disc">${conditionOptions(r.disc||"VG+")}</select></div>
 <div class="field"><label>ESTADO DE LA PORTADA</label><select id="sleeve">${conditionOptions(r.sleeve||"VG+")}</select></div>
 <div class="field"><label>FECHA DE ADQUISICIÓN</label><input id="date" value="${esc(r.date)}"></div>
 <div class="field"><label>PRECIO PAGADO</label><input id="paid" value="${esc(r.paid)}" inputmode="decimal"></div>
 <div class="field"><label>VALOR DE MERCADO</label><input id="market" value="${esc(r.market)}" inputmode="decimal"></div>
 <div class="field"><label>UBICACIÓN</label><input id="location" value="${esc(r.location)}" placeholder="Estante 3 · Repisa 2"></div>

 <div class="actions"><button class="primary" onclick="saveForm('${id||""}')">Guardar vinilo</button>${id?`<button class="secondary danger" onclick="removeRecord('${id}')">Eliminar</button>`:""}</div>
 </div>`;
 document.getElementById("format").value=r.format;document.getElementById("speed").value=r.speed;
}
function esc(s){return String(s||"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;")}

async function autofillFromWeb(){
 const artist=document.getElementById('artist')?.value.trim(), album=document.getElementById('album')?.value.trim();
 const box=document.getElementById('autoResults');
 if(!artist||!album){alert('Primero escribe el artista y el álbum.');return}
 box.innerHTML="<div class='status'>Buscando información…</div>";
 try{
   const q=`artist:"${artist.replaceAll('"','')}" AND release:"${album.replaceAll('"','')}"`;
   const url='https://musicbrainz.org/ws/2/release/?query='+encodeURIComponent(q)+'&fmt=json&limit=8';
   const res=await fetch(url,{headers:{'Accept':'application/json'}}); if(!res.ok)throw new Error('HTTP '+res.status);
   const data=await res.json(); const results=(data.releases||[]).filter(x=>x.title);
   if(!results.length){box.innerHTML="<div class='status'>No encontré coincidencias. Puedes completar los datos manualmente.</div>";return}
   box.innerHTML=`<div class='coverSearchTitle' style='grid-column:1/-1'>Selecciona la edición que corresponde a tu disco</div>`+results.map((x,i)=>`<button type='button' class='coverOption' data-mb-index='${i}'><div class='ct'><b>${esc(x.title||album)}</b><br>${esc((x.date||'').slice(0,4)||'—')} · ${esc(x.country||'País no indicado')}<br>${esc(x['label-info']?.[0]?.label?.name||'Sello no indicado')} · ${esc(x['label-info']?.[0]?.catalog-number||'Catálogo no indicado')}<br>${esc(x.media?.[0]?.format||'Formato no indicado')}</div></button>`).join('');
   box.querySelectorAll('[data-mb-index]').forEach(b=>b.addEventListener('click',()=>selectMusicBrainzRelease(results[Number(b.dataset.mbIndex)])));
 }catch(e){console.error(e);box.innerHTML="<div class='status'>La búsqueda automática no está disponible ahora. Puedes continuar manualmente.</div>"}
}
async function selectMusicBrainzRelease(x){
 if(!x)return;
 document.getElementById('year').value=(x.date||'').slice(0,4);
 document.getElementById('country').value=x.country||'';
 document.getElementById('catalog').value=x['label-info']?.[0]?.['catalog-number']||'';
 document.getElementById('barcode').value=x.barcode||'';
 document.getElementById('label').value=x['label-info']?.[0]?.label?.name||'';
 const fmt=x.media?.[0]?.format||''; if(fmt.toLowerCase().includes('vinyl'))document.getElementById('format').value='LP · 12″';
 try{
   const rel=await fetch('https://musicbrainz.org/ws/2/release/'+encodeURIComponent(x.id)+'?inc=release-groups+labels+media+genres&fmt=json',{headers:{'Accept':'application/json'}}).then(r=>r.json());
   const genres=(rel.genres||[]).sort((a,b)=>(b.count||0)-(a.count||0));
   const sel=document.getElementById('genre'); if(genres[0]){const g=genres[0].name;let opt=[...sel.options].find(o=>o.value.toLowerCase()===g.toLowerCase());if(!opt){opt=document.createElement('option');opt.value=g;opt.textContent=g;sel.appendChild(opt)}sel.value=opt.value;}
 }catch(e){}
 try{
   const ca=await fetch('https://coverartarchive.org/release/'+encodeURIComponent(x.id)+'/front');
   if(ca.ok){const url=ca.url;const p=document.getElementById('preview');p.src=url;p.style.display='block';p.dataset.cover=url;delete p.dataset.pending;delete p.dataset.clear;}
 }catch(e){}
 const box=document.getElementById('autoResults');if(box)box.innerHTML="<div class='status'>Datos completados. Revísalos antes de guardar.</div>";
 const status=document.getElementById('coverStatus');if(status)status.textContent='Datos y portada encontrados desde MusicBrainz.';
}

let scanStream=null, scanTimer=null;
async function openScanner(){
 const panel=document.getElementById('scanPanel'), video=document.getElementById('scanVideo'), status=document.getElementById('scanStatus');
 if(!panel||!video)return; panel.classList.add('open');
 if(!('BarcodeDetector' in window)){status.textContent='Este navegador no ofrece lector automático. Usa el campo de código manual.';return}
 try{
   const formats=['qr_code','ean_13','ean_8','upc_a','upc_e','code_128','itf'];
   let detector; try{detector=new BarcodeDetector({formats})}catch(e){detector=new BarcodeDetector()}
   scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
   video.srcObject=scanStream; await video.play(); status.textContent='Buscando…';
   const tick=async()=>{if(!scanStream||video.readyState<2)return;
     try{const codes=await detector.detect(video); if(codes.length){const raw=(codes[0].rawValue||'').trim(); status.textContent='Código detectado: '+raw; closeScanner(); lookupBarcode(raw); return;}}catch(e){}
     scanTimer=requestAnimationFrame(tick);
   }; tick();
 }catch(e){status.textContent='No pude abrir la cámara. Revisa el permiso de cámara o usa el código manual.'}
}
function closeScanner(){if(scanTimer)cancelAnimationFrame(scanTimer);scanTimer=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}const v=document.getElementById('scanVideo');if(v)v.srcObject=null;const p=document.getElementById('scanPanel');if(p)p.classList.remove('open')}
async function lookupBarcode(raw){
 const code=(raw||'').replace(/\D/g,''); const status=document.getElementById('coverStatus'); const box=document.getElementById('autoResults');
 if(!code){alert('Ingresa o escanea un código válido.');return}
 if(status)status.textContent='Buscando la edición asociada al código '+code+'…';
 if(box)box.innerHTML='<div class="status">Consultando MusicBrainz…</div>';
 try{
   const url='https://musicbrainz.org/ws/2/release/?query='+encodeURIComponent('barcode:'+code)+'&fmt=json&limit=8';
   const res=await fetch(url,{headers:{'Accept':'application/json'}}); if(!res.ok)throw new Error('HTTP '+res.status);
   const data=await res.json(); const results=data.releases||[];
   if(!results.length){if(box)box.innerHTML='<div class="status">No encontré una edición con ese código. Puedes probar búsqueda por artista y álbum.</div>';return}
   if(box)box.innerHTML=`<div class='coverSearchTitle' style='grid-column:1/-1'>Ediciones encontradas para ${esc(code)}</div>`+results.map((x,i)=>`<button type='button' class='coverOption' data-code-index='${i}'><div class='ct'><b>${esc(x.artist?.[0]?.name||'Artista')}</b><br>${esc(x.title||'Álbum')}<br>${esc((x.date||'').slice(0,4)||'—')} · ${esc(x.country||'País no indicado')}<br>${esc(x['label-info']?.[0]?.label?.name||'Sello no indicado')} · ${esc(x['label-info']?.[0]?.['catalog-number']||'Catálogo no indicado')}<br>${esc(x.media?.[0]?.format||'Formato no indicado')}</div></button>`).join('');
   box.querySelectorAll('[data-code-index]').forEach(b=>b.addEventListener('click',()=>selectMusicBrainzRelease(results[Number(b.dataset.codeIndex)])));
 }catch(e){console.error(e);if(box)box.innerHTML='<div class="status">No fue posible consultar la web ahora. Puedes continuar manualmente.</div>'}
}

function photoPreview(e){
 let f=e.target.files[0];if(!f)return;
 let url=URL.createObjectURL(f);let p=document.getElementById("preview");
 p.src=url;p.style.display="block";p.dataset.pending=url;p.dataset.cover="";p.dataset.clear="";
 const s=document.getElementById("coverStatus");if(s)s.textContent="Fotografía seleccionada. Se guardará con el vinilo.";
}
function clearCover(){
 const p=document.getElementById("preview");
 p.src="";p.style.display="none";delete p.dataset.pending;delete p.dataset.cover;p.dataset.clear="1";
 const s=document.getElementById("coverStatus");if(s)s.textContent="Sin portada. Puedes buscarla en la web o agregar una fotografía.";
}
function artUrl(u){return (u||"").replace(/100x100bb/g,"600x600bb").replace(/100x100/g,"600x600")}
async function searchCover(){
 const artist=document.getElementById("artist")?.value.trim();
 const album=document.getElementById("album")?.value.trim();
 const box=document.getElementById("coverResults");const status=document.getElementById("coverStatus");
 if(!artist||!album){alert("Primero escribe el artista y el álbum.");return}
 box.innerHTML="<div class='status'>Buscando portadas…</div>";
 if(status)status.textContent="Buscando una portada para "+artist+" — "+album;
 try{
   const url="https://itunes.apple.com/search?term="+encodeURIComponent(artist+" "+album)+"&entity=album&limit=12&country=CL";
   const res=await fetch(url);if(!res.ok)throw new Error("HTTP "+res.status);
   const data=await res.json();
   coverSearchResults=(data.results||[]).filter(x=>x.artworkUrl100);
   if(!coverSearchResults.length){box.innerHTML="<div class='status'>No encontré una portada. Prueba con otro nombre o agrega una foto.</div>";return}
   box.innerHTML="<div class='coverSearchTitle' style='grid-column:1/-1'>Elige la portada correcta</div>"+coverSearchResults.map((x,i)=>`<button type="button" class="coverOption" data-cover-index="${i}"><img src="${esc(artUrl(x.artworkUrl100))}" alt=""><div class="ct"><b>${esc(x.collectionName||"Álbum")}</b><br>${esc(x.artistName||artist)}</div></button>`).join("");
   box.querySelectorAll(".coverOption").forEach(btn=>btn.addEventListener("click",()=>selectWebCover(coverSearchResults[Number(btn.dataset.coverIndex)])));
   if(status)status.textContent="Selecciona la imagen que corresponda a tu disco.";
 }catch(err){
   console.error(err);
   box.innerHTML="<div class='status'>No fue posible buscar en la web en este momento. Puedes agregar una foto directamente.</div>";
   if(status)status.textContent="Búsqueda web no disponible; usa una fotografía si estás sin conexión.";
 }
}
function selectWebCover(result){
 const url=artUrl(result?.artworkUrl100||result?.artworkUrl600);if(!url)return;
 const p=document.getElementById("preview");p.src=url;p.style.display="block";delete p.dataset.pending;p.dataset.cover=url;delete p.dataset.clear;
 const box=document.getElementById("coverResults");if(box)box.innerHTML="";
 const s=document.getElementById("coverStatus");if(s)s.textContent="Portada seleccionada desde la web.";
}
async function blobToDataURL(blob){return await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=reject;rd.readAsDataURL(blob)})}
async function cacheCover(url){
 if(!url||!/^https?:/i.test(url))return url;
 try{const res=await fetch(url,{mode:"cors"});if(!res.ok)throw new Error();const blob=await res.blob();return await blobToDataURL(blob)}catch(e){return url}
}
async function saveForm(id){
 let old=id?records.find(x=>x.id===id):null;let p=document.getElementById("preview");
 const val=k=>document.getElementById(k)?.value ?? "";
 let r={id:id||String(Date.now()),artist:val("artist").trim(),album:val("album").trim(),year:val("year"),label:val("label"),country:val("country"),catalog:val("catalog"),format:val("format"),speed:val("speed"),edition:val("edition"),genre:val("genre"),barcode:val("barcode"),disc:val("disc"),sleeve:val("sleeve"),date:val("date"),paid:val("paid"),market:val("market"),location:val("location"),notes:val("notes"),favorite:old?.favorite||false,cover:old?.cover||""};
 if(!r.artist||!r.album){alert("Artista y álbum son obligatorios.");return}
 if(p.dataset.clear){r.cover=""}
 const btn=document.querySelector('.actions .primary');if(btn){btn.disabled=true;btn.textContent="Guardando…"}
 try{
   if(p.dataset.pending){
     await new Promise((resolve,reject)=>{let c=document.createElement("canvas"),ctx=c.getContext("2d"),img=new Image();img.onload=()=>{let max=1000,s=Math.min(1,max/img.width,max/img.height);c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);ctx.drawImage(img,0,0,c.width,c.height);r.cover=c.toDataURL("image/jpeg",.82);resolve()};img.onerror=reject;img.src=p.dataset.pending});
   } else if(p.dataset.cover){
     r.cover=await cacheCover(p.dataset.cover);
   }
   records=id?records.map(x=>x.id===id?r:x):[...records,r];save();detail(r.id);
 }catch(e){
   console.error(e);alert("No pude guardar la portada. El vinilo sí puede guardarse sin imagen.");
   records=id?records.map(x=>x.id===id?r:x):[...records,r];save();detail(r.id);
 }
}
function save(){localStorage.setItem("surco_records",JSON.stringify(records))}
function removeRecord(id){if(confirm("¿Eliminar este vinilo de la colección?")){records=records.filter(x=>x.id!==id);save();collection()}}
function filters(){alert("Filtros avanzados del prototipo: artista, año, país, sello, estado y ubicación. Los añadiremos como panel visual en la siguiente iteración.")}
function settings(){
 app.innerHTML=`<header><div><h1>Apariencia</h1><div class="sub">Elige el ambiente de tu biblioteca.</div></div></header><div class="page"><div class="themeGrid">
 ${themeCard("classic","Clásico","#f3eadb","#ef7f22","#171717","Cálido y atemporal")}
 ${themeCard("blue","Azul","#d7e7ee","#3e7893","#171717","Sereno y moderno")}
 ${themeCard("olive","Oliva","#e7e8d8","#53643e","#1d211a","Natural y relajado")}
 ${themeCard("night","Nocturno","#202225","#d88a42","#f7f1e5","Para escuchar de noche")}
 </div><div class="card" style="margin-top:16px"><b>V1.2</b><p style="color:var(--muted)">Ahora puedes buscar portadas en la web, tomar una fotografía o elegir una imagen. Los estados se muestran en español y se mantiene el código NM, EX, VG+, etc.</p></div></div>${nav()}`;

home();
